services:
  postgres:
    image: postgres:16-alpine
    container_name: unicon-report-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unicon_reports
      POSTGRES_USER: unicon_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - unicon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  unicon_pgdata:
